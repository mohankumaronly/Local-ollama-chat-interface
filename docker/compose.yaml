name: local-ollama-chat

services:
  db:
    image: postgres:16-alpine
    container_name: local-ollama-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ollama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ollama_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ollama_chat}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ollama} -d ${POSTGRES_DB:-ollama_chat}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    container_name: local-ollama-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ollama}:${POSTGRES_PASSWORD:-ollama_secret}@db:5432/${POSTGRES_DB:-ollama_chat}
      
      # Defaults to host.docker.internal, but can be overridden in docker/.env for remote Ollama
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_ALLOWED_HOSTS: "*.trycloudflare.com,localhost,127.0.0.1,host.docker.internal"
      
      API_TOKEN: ${API_TOKEN:-}
      API_TOKEN_FILE: /app/data/api-token
      MIGRATIONS_AUTO: ${MIGRATIONS_AUTO:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      API_TOKEN_FORCE_DISPLAY: ${API_TOKEN_FORCE_DISPLAY:-false}
    volumes:
      - api_token:/app/data
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: local-ollama-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
    name: local-ollama-pgdata
  api_token:
    name: local-ollama-api-token